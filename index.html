<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./assets/styles/typebackground.css">
    <link rel="Icon" href="./assets/Icon/favicon.png">
    <script defer src="./script.js"></script>
    <script defer src="./template.js"></script>

</head>

<body onload="init()">
    <header>
        <a href=""><h1>Pokedex</h1></a>
        <div class="searchbar-wrapper">
        <input type="text" placeholder="Search Pokemon..." data-id="search-input" id="search-input">
        <button data-id="search-button" aria-label="Search" onclick="search()">Search</button>
        <p id="search-hint">bitte mehr als 3 Zeichen</p>
    </div>
    </header>
    <main data-id="content">
        <section id="content" class="content-wrapper">
            <div class="loading-screen">
                <img src="./assets/Icon/Pokeball.svg" alt="pokeball pictogramm">
                <p>No Pokemon Found, yet...</p>
            </div>
        </section>
        <div class="load-button" data-id="load-more" aria-label="load more" id="load-Button">
        <button class="load-more-button" onclick="loadMorePokemon()" id="load-more">load more</button>
        </div>
        <dialog id="detail-Dialog" data-id="dialog" aria-label="Details">
        </dialog>
    </main>
</body>

</html>
